<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контакты — JapZabCar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="assets/css/style.css">

</head>
<body>
<header class="site">
  <div class="container">
    <a href="index.html" class="logo"><img src="assets/logo.png" alt="JapZabCar"></a>
    <nav class="main">
      <a href="index.html" >Главная</a>
      <a href="portfolio.html" >Доставленные авто</a>
      <a href="calculator.html" >Калькулятор</a>
      <a href="contacts.html" class="active">Контакты</a>
    </nav>
  </div>
</header>


<section class="container">
  <h2 class="section-title">Контакты</h2>
  <p class="section-subtitle">Оставьте заявку — ответим в Telegram или WhatsApp, обычно в течение дня</p>

  <div class="panel">
    <div class="contact-box">
      <form id="leadForm" onsubmit="return sendLead(event)">
        <label for="name">Имя</label>
        <input type="text" id="name" required>

        <label for="phone">Телефон / Telegram</label>
        <input type="text" id="phone" required>

        <label for="message">Что ищете</label>
        <textarea id="message" rows="4" placeholder="Например: Toyota Vezel, до 1.5 млн, для себя"></textarea>

        <button class="btn btn-primary" type="submit" style="margin-top:18px;width:100%;">Отправить заявку</button>
        <div class="contact-status" id="leadStatus"></div>
      </form>
    </div>

    <p style="margin-top:28px;">Или сразу пишите/звоните:</p>
    <p>
      <a class="btn btn-primary" href="https://wa.me/79963133996">WhatsApp</a>
      <a class="btn btn-ghost" style="color:var(--accent);border-color:var(--border);" href="https://t.me/JapZabCar">Telegram-канал</a>
    </p>
  </div>
</section>

<script>
// TODO: заменить на реальный Telegram Bot API вызов, когда будет создан бот через @BotFather
// (нужен BOT_TOKEN и CHAT_ID менеджера). Пока форма просто открывает WhatsApp с готовым текстом заявки —
// рабочий вариант без бэкенда, ничего не потеряется, просто на шаг больше кликов у клиента.
function sendLead(e) {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  const message = document.getElementById('message').value;
  const text = encodeURIComponent(`Заявка с сайта\nИмя: ${name}\nКонтакт: ${phone}\nЗапрос: ${message}`);
  document.getElementById('leadStatus').textContent = 'Открываем WhatsApp с вашей заявкой...';
  window.open(`https://wa.me/79963133996?text=${text}`, '_blank');
  return false;
}
</script>

<footer class="site">
  <div class="container">
    <div>JapZabCar &mdash; авто из Японии, Кореи и Китая под ключ.</div>
    <div style="margin-top:8px;">Телефон/WhatsApp: <a href="https://wa.me/79963133996">+7 996 313-39-96</a> &middot; Telegram: <a href="https://t.me/JapZabCar">@JapZabCar</a></div>
  </div>
</footer>

<script src="assets/js/header.js" defer></script>
<script src="assets/js/reveal.js" defer></script>
</body>
</html>
